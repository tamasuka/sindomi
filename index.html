[1. プロジェクト概要・コンセプト]
・タイトル：魔法宝石店 エフェメラ — AIインタラクティブ乙女ゲー
・現行バージョン：v0.4
・公開形態：単一HTMLファイル（index.html）完結型Webアプリ（GitHub Pages・Googleサイト埋め込み対応）
・コンセプト：
  ・外部のAIチャット（Gemini / Claude等）とコピペ往復して遊ぶ、ダークファンタジー系の
    「シミュレーション育成×AIインタラクティブ乙女ゲー」。
  ・3年生の4月〜翌年3月の卒業（余命1年）までのタイムリミットの中で、店先のソファーで
    使い捨て魔法石を編んで魔力を排熱しながら、攻略対象たちとの親愛度と「人間のまま ⇔
    グラフト（人外）」の境界ゲージを育て、エンディングへ辿り着く。
  ・2周目（クリア後、または設定の即時スイッチ）で真相枠「仮面の講師カシウス」が解禁される。

[2. 絶対に崩してはいけない設計原則（厳守事項）]
1) 単一HTMLファイル＆完全オフライン完結（阿部寛アーキテクチャ）
   ・HTML / CSS / JS / SVGをすべて1つのHTMLファイルに収め、外部CDN・外部ライブラリ・
     外部サーバー通信を一切使用しない。
2) Googleサイト埋め込み（iframe）安全対応
   ・localStorage が例外を投げる隔離環境でも落ちない安全ラッパー（メモリフォールバック）を維持。
   ・navigator.clipboard が弾かれる環境向けに、プロンプトは常時textareaに表示し、
     「全選択」ボタンおよびテキスト版セーブ復元（復活の呪文）を必ず残す。
3) 既存セーブデータ後方互換＆完全ローカル保存
   ・localStorage キー名：ephemera_otome_v1（絶対に変更しないこと）。
   ・立ち絵画像は IndexedDB（DB: ephemera_otome_images_v1 / Store: portraits）に
     ローカル保存し、外部送信しない（IndexedDB不可時はメモリ/安全フォールバック）。
   ・新フィールド追加時は createDefaultState() と migrateStateIfNeeded(st) を必ず更新する。
4) 表現・世界観トーンの厳守
   ・「カウチ」は使わず必ず「ソファー」表記で統一する。
   ・導入文にヒューマニックストーンの説明を含める。
   ・光源切替（昼光：ロイヤルブルー×白磁・金縁 ⇔ ランプ光：純黒×深紅・琥珀）と、
     アレク（アレキサンドライト）の宝石SVG変色演出を維持する。
   ・立ち絵は 3:4 比率クロッパー（ドラッグ移動・0.5〜3.0倍ズーム・十字ガイド線）を維持する。
   ・z-index 階層：ヘッダー(40) ＜ 下部ナビ(50) ＜ 一般モーダル(100) ＜ クロッパー(150) ＜ トースト(200)

[3. 世界観＆キャラクター設定（GMプロンプト・辞典の正本）]
・舞台：亡き祖母マルタ（料理上手で祝福の魔法のお菓子を売っていた優しい魔法使い）から
  受け継いだ小さなお店。学院と併設病院の近くにある。両親と祖父は一般人のため物語本筋からは離す。
・主人公（既定名：アルフィリア／変更可）：
  ・魔法学院・宝石魔法学専攻3年生。魔力が強すぎて併設病院の常連（国の宝＝他国流出防止の鳥籠）。
  ・余命1年（卒業と同時期に命が尽きる予定）。1年時に学科首席「青いローブ＋金の縁取り」を取得し、
    宝物庫へのアクセス権（生きるか死ぬか選べる状態）だけ確保して2年時のローブ枠は他者へ譲った。
  ・店のソファーでゴロゴロしながら使い捨て魔法石（指定回数で砕け散る灯り石・回復石・ニッチ特注品）
    を編んで魔力の毒を排熱している。
・ヒューマニックストーン：
  ・人々の強い想いを吸って姿を得た宝石。想いの総量が多いほど人型に近い傾向（ただし「手足になる」
    等の切実な願いでペガサス等の姿を選ぶことも多い）。魔力ゼロでも相性次第で契約しうる。
  ・天然石に完璧はなく、クラック充填やシールドコーティングの定期メンテナンスが不可欠。
  ・メンテナンス中は無防備な「ただの石」へ戻って宝石魔術師に身を委ねる必要があり、
    施術には魔力を編み上げる凄まじい集中力を要する。
・2種類の契約：
  1) 使役契約（通常契約）：石が「お前の命のある期間だけ付き合ってやる」有限契約。寿命は延びない。
  2) グラフト契約（Graft）：人間側が外観等の大事なものを対価に差し出し、宝物庫のいわくつき呪物を
     臓器（ドナー）として体内に組み込み命を繋ぐ契約。適合に失敗すると吹き飛び死する。
     一般人からは畏怖されつつも「グラフトだから気持ち悪い」等と忌み嫌われる。
・登場人物（7名／すべて3:4立ち絵差し込み対応）：
  ・アルフィリア（主人公／変更可）
  ・アレク（攻略対象①・アレキサンドライト・人外執事）：宝物庫で高熱で倒れた主人公と使役契約。
    昼光で青緑、ランプ光で深紅に瞳と石が変色。普段は伊達メガネ。夜中の高熱時に「私を臓器に
    しませんか」とグラフト契約を囁く。宝物庫の特級品のため併設病院の病室まで付き添いOK。
  ・エリック（攻略対象②・遠方の国の最前線騎士）：魔力ゼロ・明日の命の保証なし。ルークの口内
    クラックを徹夜で直してもらってから主人公を放っておけない。学院関係者ではないため併設病院に
    立ち入れない（例外として国へ正式な婚姻申請をすれば家族として入室可／ただしルークは宝石に戻る）。
  ・ルーク（エリックの相棒・漆黒のペガサス）：本体は両親の形見のブラックダイヤペンダント。
    純粋でカタコト。初回メンテ時にエリックへ「どこにもいかないで」と条件を出し石に戻った。
  ・セドリック（攻略対象③・2年時青ローブ＋金縁の同級生／変更可）：自由席なのにたまに隣に座る。
    主人公欠席・辞退による不戦勝の金縁に納得していない。「俺だって悩んでんだよ！一緒に悩んでやるよ！」
    と向き合う同類。短命を受け入れて卒業後「国家の犬」となるか、グラフトか、吹き飛び死かの岐路。
    アレクとは相性最悪。
  ・アルカ＆ディア（祖母マルタから受け継いだ双子ルビーのピアス）：くるくる髪とストレート髪の
    賑やかなお姉さん姉妹。マルタから「私が死んだらこの子を頼むよ」と託されている。
  ・カシウス（攻略対象④・2周目真相枠・仮面の講師）：普段は仮面で片目を隠す学院講師・宝物庫管理者。
    片目に呪いのブルーダイヤ『ブルー・ウィドウ』をグラフトしている。かつて祖母マルタに片恋して
    いたが、自身の強すぎる魔力ゆえグラフトで異形になるしかなく、普通の生活を望んだマルタを見送り、
    今はその孫アルフィリアを静かに守っている。

[4. データ構造＆AI連携プロトコル]
・localStorage / キー: ephemera_otome_v1

// ============================================================
// 1. SAFE STORAGE WRAPPER (Google Sites iframe safe)
// ============================================================
const SAVE_KEY = "ephemera_otome_v1";
const IMG_DB_NAME = "ephemera_otome_images_v1";
const IMG_DB_STORE = "portraits";

const memoryStore = {};
const SafeStorage = {
  get(key) {
    try { return window.localStorage.getItem(key); }
    catch (e) { return memoryStore[key] || null; }
  },
  set(key, val) {
    memoryStore[key] = val;
    try { window.localStorage.setItem(key, val); }
    catch (e) {}
  }
};

let portraitMap = {};
function openPortraitDB() {
  return new Promise(resolve => {
    try {
      if (!window.indexedDB) return resolve(null);
      const req = indexedDB.open(IMG_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IMG_DB_STORE)) db.createObjectStore(IMG_DB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function loadPortraits() {
  const db = await openPortraitDB();
  if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(IMG_DB_STORE, "readonly");
      const req = tx.objectStore(IMG_DB_STORE).openCursor();
      req.onsuccess = e => {
        const cur = e.target.result;
        if (cur) { portraitMap[cur.key] = cur.value; cur.continue(); }
        else resolve();
      };
      req.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}
async function savePortrait(charId, dataUrl) {
  portraitMap[charId] = dataUrl;
  const db = await openPortraitDB();
  if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(IMG_DB_STORE, "readwrite");
      tx.objectStore(IMG_DB_STORE).put(dataUrl, charId);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}
async function removePortrait(charId) {
  delete portraitMap[charId];
  const db = await openPortraitDB();
  if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(IMG_DB_STORE, "readwrite");
      tx.objectStore(IMG_DB_STORE).delete(charId);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}

function migrateStateIfNeeded(st) {
  let changed = false;
  if (!st.characters) { st.characters = createDefaultState().characters; changed = true; }
  ["alex","eric","luke","cedric","alka_dia","cassius","protagonist"].forEach(id => {
    if (!st.characters[id]) { st.characters[id] = { affection: 15, unlockedSecrets: [0] }; changed = true; }
    if (!Array.isArray(st.characters[id].unlockedSecrets)) { st.characters[id].unlockedSecrets = [0]; changed = true; }
  });
  if (!Array.isArray(st.shelf)) { st.shelf = []; changed = true; }
  if (!Array.isArray(st.requests)) { st.requests = NICHE_REQUEST_POOL.slice(0, 3).map(x => Object.assign({}, x)); changed = true; }
  if (!Array.isArray(st.album)) { st.album = []; changed = true; }
  if (!Array.isArray(st.endings)) { st.endings = []; changed = true; }
  if (!st.totalTurns || (st.totalTurns !== 12 && st.totalTurns !== 24)) { st.totalTurns = 24; changed = true; }
  if (!st.rivalName) { st.rivalName = "セドリック"; changed = true; }
  if ((Number(st.version) || 0) < 0.4) { st.version = 0.4; changed = true; }
  return changed;
}

function saveState() { SafeStorage.set(SAVE_KEY, JSON.stringify(state)); }
function loadState() {
  try {
    const raw = SafeStorage.get(SAVE_KEY);
    if (raw) {
      state = Object.assign(createDefaultState(), JSON.parse(raw));
      if (migrateStateIfNeeded(state)) saveState();
    }
  } catch (e) {
    state = createDefaultState();
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

function getCalendarLabel(turn) {
  const arr = state.totalTurns === 12 ? CALENDAR_12 : CALENDAR_24;
  const idx = Math.max(0, Math.min(arr.length - 1, (turn || 1) - 1));
  return arr[idx];
}

function isCassiusOpen() {
  return !!(state.cassiusUnlocked || (state.clearedCount || 0) >= 1);
}

function craftStone() {
  if (state.shelf.length >= 8) {
    showToast("棚がいっぱいです（最大8スロット）。どれかを下げてから作ってね！");
    return;
  }
  const name = (document.getElementById("craft-name")?.value || "").trim() || "名もなき排熱石";
  const uses = Math.max(1, Math.min(20, parseInt(document.getElementById("craft-uses")?.value, 10) || 5));
  const price = Math.max(50, Math.min(9999, parseInt(document.getElementById("craft-price")?.value, 10) || 220));
  const effect = (document.getElementById("craft-effect")?.value || "").trim() || `${uses}回使うと静かに砕け散る使い捨て魔法石。`;

  state.shelf.push({
    id: "st_" + Date.now().toString(36),
    name, uses, price, effect,
    shape: state.craftShape,
    color: state.craftColor
  });
  // Exhale magic pressure cleanly while resting on the sofa
  state.magicPressure = Math.max(0, state.magicPressure - 14);
  state.health = Math.min(100, state.health + 4);
  saveState();
  renderAll();
  showToast(`💎「${name}」をソファーで編んで棚に出しました（魔力圧 -14%）`);
}

function removeShelfItem(id) {
  state.shelf = state.shelf.filter(x => x.id !== id);
  saveState();
  renderAll();
  showToast("棚から石を下げました");
}

function fulfillRequest(reqId) {
  const idx = state.requests.findIndex(r => r.id === reqId);
  if (idx < 0) return;
  const req = state.requests[idx];
  state.gold += req.reward;
  state.magicPressure = Math.max(0, state.magicPressure - 16);
  state.health = Math.max(10, state.health - 4);
  state.requests.splice(idx, 1);
  // Replenish a fresh request if pool has unused
  const existingIds = new Set(state.requests.map(r => r.id));
  const nextReq = NICHE_REQUEST_POOL.find(r => !existingIds.has(r.id) && r.id !== reqId);
  if (nextReq && state.requests.length < 3) state.requests.push(Object.assign({}, nextReq));
  saveState();
  renderAll();
  showToast(`✨ 特注「${req.title}」をソファーで即興作成＆納品！ +${req.reward} G`);
}

function applyAILog() {
  const raw = (document.getElementById("bridge-return-input")?.value || "").trim();
  if (!raw) {
    showToast("AIから返ってきたログを貼り付けてね！");
    return;
  }
  let jsonStr = "";
  const m = raw.match(/\[EPHEMERA_RESULT\]([\s\S]*?)\[\/EPHEMERA_RESULT\]/i);
  let narrative = raw;
  if (m) {
    jsonStr = m[1].trim();
    narrative = raw.replace(m[0], "").trim();
  } else {
    const f = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (f) {
      jsonStr = f[1].trim();
      narrative = raw.replace(f[0], "").trim();
    } else {
      const s = raw.lastIndexOf("{"), e = raw.lastIndexOf("}");
      if (s >= 0 && e > s) {
        jsonStr = raw.slice(s, e + 1);
        narrative = raw.slice(0, s).trim();
      }
    }
  }

  let data = null;
  if (jsonStr) {
    try { data = JSON.parse(jsonStr.replace(/,\s*([\]}])/g, "$1")); }
    catch (err) { showToast("⚠️ JSONブロックの形式が少し壊れています。そのまま全文保存のみ行います"); }
  }

  const curDate = getCalendarLabel(state.turn);
  let title = (data && data.title) ? String(data.title) : `${curDate}の記録`;
  let focusChar = (data && data.focusChar) ? String(data.focusChar) : state.selectedFocus;

  if (data) {
    state.health = Math.max(0, Math.min(100, state.health + (Number(data.healthDelta) || 0)));
    state.magicPressure = Math.max(0, Math.min(100, state.magicPressure + (Number(data.pressureDelta) || 0)));
    state.boundary = Math.max(0, Math.min(100, state.boundary + (Number(data.boundaryDelta) || 0)));
    state.gold = Math.max(0, state.gold + (Number(data.goldDelta) || 0));

    if (Array.isArray(data.soldShelfIds) && data.soldShelfIds.length) {
      const soldSet = new Set(data.soldShelfIds);
      state.shelf = state.shelf.filter(s => !soldSet.has(s.id));
    }
    if (data.affectionDeltas && typeof data.affectionDeltas === "object") {
      Object.entries(data.affectionDeltas).forEach(([cid, delta]) => {
        if (state.characters[cid]) {
          state.characters[cid].affection = Math.max(0, Math.min(100, (state.characters[cid].affection || 0) + (Number(delta) || 0)));
        }
      });
    }
    if (Array.isArray(data.unlockSecrets)) {
      data.unlockSecrets.forEach(u => {
        if (u && u.charId && state.characters[u.charId]) {
          const arr = state.characters[u.charId].unlockedSecrets;
          const idx = Number(u.index);
          if (!arr.includes(idx)) arr.push(idx);
        }
      });
    }
    if (data.endingTitle && String(data.endingTitle).trim()) {
      const ed = String(data.endingTitle).trim();
      state.endings.unshift({ title: ed, date: new Date().toLocaleDateString("ja-JP"), boundary: state.boundary });
      state.clearedCount = (state.clearedCount || 0) + 1;
      state.cassiusUnlocked = true;
      showToast(`🎉 エンディング『${ed}』到達！ 2周目真相枠「カシウス」が解禁されました！`);
    }
    if (data.advanceTurn !== false) {
      if (state.turn < state.totalTurns) state.turn += 1;
    }
  } else {
    if (state.turn < state.totalTurns) state.turn += 1;
  }

  state.album.unshift({
    id: "alb_" + Date.now().toString(36),
    turn: state.turn,
    dateLabel: curDate,
    title,
    focusChar,
    text: narrative || raw,
    favorite: false,
    createdAt: new Date().toLocaleString("ja-JP")
  });
  state.memo = "";
  saveState();
  renderAll();
  const inp = document.getElementById("bridge-return-input");
  if (inp) inp.value = "";
  if (!data || !data.endingTitle) showToast(`📖「${title}」を反映して回想アルバムへ保存しました！`);
}

// ============================================================
// 7. 3:4 PORTRAIT CROPPER (Drag + Zoom + Crosshair Guide)
// ============================================================
let cropState = null;
let pendingPortraitCharId = null;

function triggerPortraitUpload(charId) {
  pendingPortraitCharId = charId;
  const inp = document.getElementById("portrait-file-input");
  inp.value = "";
  inp.click();
}

document.getElementById("portrait-file-input").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file || !pendingPortraitCharId) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => openCropper(img, pendingPortraitCharId);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function openCropper(img, charId) {
  const vw = 240, vh = 320;
  const coverScale = Math.max(vw / img.width, vh / img.height);
  cropState = {
    img, charId, vw, vh,
    baseScale: coverScale, zoom: 1.0,
    ox: 0, oy: 0, dragging: false, sx: 0, sy: 0, sox: 0, soy: 0,
    pinchDist: 0, pinchZoom: 1.0
  };
  const ch = getCharactersMaster().find(c => c.id === charId);
  document.getElementById("crop-title").textContent = `🖼️ ${ch ? ch.name : ""} 立ち絵（3:4）調整`;
  const canvas = document.getElementById("crop-canvas");
  canvas.width = 480; canvas.height = 640;
  document.getElementById("crop-zoom").value = 100;
  document.getElementById("crop-zoom-txt").textContent = "100%";
  drawCropper();
  document.getElementById("crop-backdrop").classList.add("open");
}

function closeCropper() {
  document.getElementById("crop-backdrop").classList.remove("open");
  cropState = null;
}

function onCropZoom(val) {
  if (!cropState) return;
  const z = Math.max(0.5, Math.min(3.0, (Number(val) || 100) / 100));
  const r = z / cropState.zoom;
  cropState.zoom = z;
  cropState.ox *= r;
  cropState.oy *= r;
  document.getElementById("crop-zoom-txt").textContent = Math.round(z * 100) + "%";
  drawCropper();
}

function resetCropTransform() {
  if (!cropState) return;
  cropState.zoom = 1.0; cropState.ox = 0; cropState.oy = 0;
  document.getElementById("crop-zoom").value = 100;
  document.getElementById("crop-zoom-txt").textContent = "100%";
  drawCropper();
}

function drawCropper() {
  if (!cropState) return;
  const st = cropState;
  const canvas = document.getElementById("crop-canvas");
  const ctx = canvas.getContext("2d");
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(2, 2);
  const sc = st.baseScale * st.zoom;
  const dw = st.img.width * sc, dh = st.img.height * sc;
  const dx = (st.vw - dw) / 2 + st.ox;
  const dy = (st.vh - dh) / 2 + st.oy;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(st.img, dx, dy, dw, dh);
  // Crosshair & Rule-of-thirds guide
  ctx.strokeStyle = "rgba(229, 190, 92, 0.45)";
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(st.vw / 2, 0); ctx.lineTo(st.vw / 2, st.vh);
  ctx.moveTo(0, st.vh / 2); ctx.lineTo(st.vw, st.vh / 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
  ctx.beginPath();
  ctx.moveTo(st.vw / 3, 0); ctx.lineTo(st.vw / 3, st.vh);
  ctx.moveTo(st.vw * 2 / 3, 0); ctx.lineTo(st.vw * 2 / 3, st.vh);
  ctx.moveTo(0, st.vh / 3); ctx.lineTo(st.vw, st.vh / 3);
  ctx.moveTo(0, st.vh * 2 / 3); ctx.lineTo(st.vw, st.vh * 2 / 3);
  ctx.stroke();
  ctx.restore();
}

async function saveCroppedPortrait() {
  if (!cropState) return;
  const st = cropState;
  const out = document.createElement("canvas");
  out.width = 360; out.height = 480;
  const ctx = out.getContext("2d");
  const mult = 360 / st.vw;
  const sc = st.baseScale * st.zoom * mult;
  const dw = st.img.width * sc, dh = st.img.height * sc;
  const dx = (360 - dw) / 2 + st.ox * mult;
  const dy = (480 - dh) / 2 + st.oy * mult;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(st.img, dx, dy, dw, dh);
  const dataUrl = out.toDataURL("image/jpeg", 0.88);
  await savePortrait(st.charId, dataUrl);
  closeCropper();
  renderAll();
  showToast("🖼️ 3:4立ち絵を切り抜き保存しました！");
}

(function bindCropFrame() {
  const fr = document.getElementById("crop-frame");
  if (!fr) return;
  fr.addEventListener("mousedown", e => {
    if (!cropState) return;
    cropState.dragging = true;
    cropState.sx = e.clientX; cropState.sy = e.clientY;
    cropState.sox = cropState.ox; cropState.soy = cropState.oy;
  });
  window.addEventListener("mousemove", e => {
    if (!cropState || !cropState.dragging) return;
    cropState.ox = cropState.sox + (e.clientX - cropState.sx);
    cropState.oy = cropState.soy + (e.clientY - cropState.sy);
    drawCropper();
  });
  window.addEventListener("mouseup", () => { if (cropState) cropState.dragging = false; });
  fr.addEventListener("wheel", e => {
    if (!cropState) return;
    e.preventDefault();
    const cur = Math.round(cropState.zoom * 100);
    const next = Math.max(50, Math.min(300, cur + (e.deltaY < 0 ? 10 : -10)));
    document.getElementById("crop-zoom").value = next;
    onCropZoom(next);
  }, { passive: false });
  fr.addEventListener("touchstart", e => {
    if (!cropState) return;
    if (e.touches.length === 1) {
      cropState.dragging = true; cropState.pinchDist = 0;
      cropState.sx = e.touches[0].clientX; cropState.sy = e.touches[0].clientY;
      cropState.sox = cropState.ox; cropState.soy = cropState.oy;
    } else if (e.touches.length === 2) {
      cropState.dragging = false;
      cropState.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      cropState.pinchZoom = cropState.zoom;
    }
  }, { passive: true });
  fr.addEventListener("touchmove", e => {
    if (!cropState) return;
    e.preventDefault();
    if (e.touches.length === 1 && cropState.dragging) {
      cropState.ox = cropState.sox + (e.touches[0].clientX - cropState.sx);
      cropState.oy = cropState.soy + (e.touches[0].clientY - cropState.sy);
      drawCropper();
    } else if (e.touches.length === 2 && cropState.pinchDist > 0) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const next = Math.max(50, Math.min(300, Math.round(cropState.pinchZoom * (d / cropState.pinchDist) * 100)));
      document.getElementById("crop-zoom").value = next;
      onCropZoom(next);
    }
  }, { passive: false });
  fr.addEventListener("touchend", () => { if (cropState) { cropState.dragging = false; cropState.pinchDist = 0; } }, { passive: true });
})();

function copyTextSafe(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
  } else {
    fallbackCopy(text, msg);
  }
}
function fallbackCopy(text, msg) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); showToast(msg); }
  catch (e) { showToast("テキスト枠を長押しして手動コピーしてね！"); }
  document.body.removeChild(ta);
}
function selectTextarea(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.focus(); el.select();
  try { el.setSelectionRange(0, el.value.length); } catch (e) {}
  showToast("全選択しました！ そのままコピーできます");
}

function exportSaveSpell() {
  const json = JSON.stringify(state);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  const el = document.getElementById("save-spell-box");
  if (el) el.value = b64;
  copyTextSafe(b64, "📤 復活の呪文を書き出してコピーしました！");
}
function importSaveSpell() {
  const raw = (document.getElementById("save-spell-box")?.value || "").trim();
  if (!raw) { showToast("復活の呪文を貼り付けてね！"); return; }
  try {
    const parsed = raw.startsWith("{") ? JSON.parse(raw) : JSON.parse(decodeURIComponent(escape(atob(raw))));
    state = Object.assign(createDefaultState(), parsed);
    migrateStateIfNeeded(state);
    saveState();
    renderAll();
    showToast("📥 復活の呪文からデータを復元しました！");
  } catch (e) {
    showToast("⚠️ 呪文の形式が正しくありません");
  }
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  clearTimeout(toastTimer);
  t.textContent = msg;
  t.classList.add("show");
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

      <div class="glossary-item"><strong>使役契約（通常契約）</strong>ヒューマニックストーンが「お前の命のある期間だけ付き合ってやる」と結ぶ有限の契約（アレク、アルカ＆ディア等）。寿命自体は延びない。</div>
      <div class="glossary-item"><strong>グラフト契約（Graft）</strong>人間側が外観等の大事なものを対価に差し出し、宝物庫のいわくつき呪物を臓器（ドナー）として体内に組み込み命を繋ぐ契約。適合に失敗すればその場で吹き飛び死する。生き延びても異形化するため、世間からは畏怖されつつも「グラフトだから気持ち悪い」等と忌み嫌われる。</div>
      <div class="glossary-item"><strong>青いローブと金の縁取り</strong>宝物庫へ入るための成績優秀者の証（青＝宝石魔法学科、金縁＝首席）。余命宣告を受けた学生にとっては生き残るための椅子取りゲーム。${pName}は1年時に取得し2年時は譲ったため、2年時首席の${rName}は不戦勝の金縁に納得していない。</div>
      <div class="glossary-item"><strong>併設病院と国家管理（立ち入り制限）</strong>強魔力者は他国流出防止のため国の管理下に置かれる。宝物庫由来のアレクは病室へ付き添えるが、学院関係者ではないエリック＆ルークは病院へ立ち入れない。例外として国へ正式な婚姻申請をすればエリックは家族として入室可能だが、ルークは宝石の姿に戻って待機する必要がある。</div>
      <div class="glossary-item"><strong>使い捨て魔法石（排熱クラフト）</strong>指定回数使うと砕け散る実用石（灯り石、ポーション代わりの回復石、雨漏り詰め石や犬用の喋る迷子札など）。${pName}がソファーでゴロゴロしながら編むことで体内の魔力圧を逃がしている。</div>
      <div class="glossary-item"><strong>呪いの蒼玉『ブルー・ウィドウ』</strong>身につけた者をことごとく不幸にした呪いのブルーダイヤ。仮面の講師カシウスが片目にグラフトしている（2周目真相枠で深掘り）。</div>
    </div>

    <div class="card">
      <div class="card-title"><span>⚙️ カスタマイズ設定</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
        <div><label class="field-label">主人公の名前</label><input id="set-pname" class="input-field" value="${esc(state.protagonistName)}" maxlength="18"></div>
        <div><label class="field-label">同級生の名前</label><input id="set-rname" class="input-field" value="${esc(state.rivalName)}" maxlength="18"></div>
      </div>
      <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:10px;">
        <div><label class="field-label">お店の名前</label><input id="set-shop" class="input-field" value="${esc(state.shopName)}" maxlength="28"></div>
        <div>
          <label class="field-label">1年間の長さ</label>
          <select id="set-turns" class="select-field">
            <option value="24" ${state.totalTurns===24?'selected':''}>しっかり（24ターン）</option>
            <option value="12" ${state.totalTurns===12?'selected':''}>あっさり（12ターン）</option>
          </select>
        </div>
      </div>
      <button class="btn-gold" style="width:100%;margin-bottom:8px;" onclick="saveSettings()">💾 名前・ターン設定を保存</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-secondary" style="flex:1;" onclick="toggleCassiusManual()">${isCassiusOpen() ? "🔓 2周目カシウス：解禁済（切替）" : "🗝️ 2周目カシウスを今すぐ解禁"}</button>
        <button class="btn-primary" style="flex:1;" onclick="startNextLoop()">🌸 2周目（4月）を始める</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>💾 復活の呪文（セーブ＆Googleサイト対策）</span></div>
      <div class="sub-text" style="margin-bottom:8px;">
        通常はブラウザに自動保存されますが、Googleサイト埋め込み等で保存が消える環境では、下の「復活の呪文」をメモ帳へ控えておくと安全です。
      </div>
      <textarea id="save-spell-box" class="code-box" style="min-height:80px;" placeholder="書き出した呪文、または復元したい呪文を貼り付け"></textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr 0.7fr;gap:6px;margin-top:8px;">
        <button class="btn-primary" onclick="exportSaveSpell()">📤 呪文書き出し</button>
        <button class="btn-gold" onclick="importSaveSpell()">📥 呪文から復元</button>
        <button class="btn-danger" onclick="hardResetAll()">🗑️ 初期化</button>
      </div>
    </div>
  `;
}

function renderAll() {
  renderHeader();
  renderHomeTab();
  renderCraftTab();
  renderCharsTab();
  renderBridgeTab();
  renderAlbumTab();
  renderGuideTab();
}

// ============================================================
// 11. BOOTSTRAP
// ============================================================
(async function init() {
  loadState();
  await loadPortraits();
  renderAll();
})();
</script>
</body>
</html>
